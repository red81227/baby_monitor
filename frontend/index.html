<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BabyMonitor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="layout">
    <section class="card">
      <h1>BabyMonitor</h1>
      <p id="status">Connecting...</p>
      <div class="viewer">
        <canvas id="view" width="1280" height="720" aria-label="Live view"></canvas>
        <p id="overlay" class="overlay" hidden></p>
      </div>
      <p id="meta" class="meta"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
